name: Build Plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily watch: cheap. compat-discover compares the newest OBS release
    # against obs-compat.json and starts the heavy jobs only when OBS moved.
    - cron: "0 6 * * *"
    # Weekly full run: not all breakage is version-driven — runner images and
    # system dependencies rot on their own schedule.
    - cron: "0 7 * * 1"

# Least privilege by default: only the release job needs to write to the
# repository, and it asks for that itself. A build job that is compromised (or
# an action whose tag is repointed) otherwise inherits push access it never
# needed.
permissions:
  contents: read

# Actions are pinned to a commit, with the tag in a trailing comment. A tag is a
# movable pointer: whoever can push to an action's repository can repoint it at
# different code, and every workflow that trusts the tag runs that code on the
# next build. The comment is what keeps the pin readable and updatable.

env:
  OBS_VERSION: "32.2.2"
  # There is deliberately no OBS_DEPS_VERSION or Qt version here any more. The
  # Windows and macOS jobs read both from OBS_VERSION's own CMakePresets.json
  # (tools/obs_deps.py): typed in by hand they had drifted to a Qt and an
  # obs-deps release that OBS itself no longer used.
  # The macOS version the shipped plugin actually supports. Pinned, not left to
  # default, because CMake otherwise targets whatever the runner happens to be
  # running: the binary's real minimum used to follow the runner image while the
  # bundle's Info.plist claimed 11.0, so the package promised macOS versions it
  # could not run on. 13.0 is what OBS 32.2 itself targets
  # (CMakePresets.json: CMAKE_OSX_DEPLOYMENT_TARGET), and the plugin links
  # against those libraries, so it cannot honestly claim to support less.
  # This one value feeds both cmake invocations and LSMinimumSystemVersion, so
  # the binary and the manifest cannot disagree again.
  MACOS_DEPLOYMENT_TARGET: "13.0"

jobs:
  tests:
    name: Unit tests
    # Skipped on the daily watch, and only there. That cron exists to ask OBS
    # whether it has published anything; on a quiet day `compat-discover`
    # answers in about seven seconds and nothing else needs to wake up. Without
    # this, adding the daily cron quietly moved the whole platform build matrix
    # from once a week to seven times a week, because these jobs are not gated
    # on the event at all.
    #
    # The other build jobs follow from here rather than repeating the
    # condition: they declare `needs: tests`, and Actions skips a job whose
    # dependency was skipped. `compat-discover` is deliberately outside that
    # chain — it has no `needs:` (see its own comment below), which is exactly
    # what lets the watch run on a day when everything else stays asleep.
    #
    # Every other trigger still runs the full workflow: pushes, pull requests,
    # tags, manual dispatch, and the weekly cron, which exists precisely to
    # catch the breakage that is not version-driven.
    if: github.event_name != 'schedule' || github.event.schedule != '0 6 * * *'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - run: cmake -B build -S . -G Ninja -DBUILD_PLUGIN=OFF -DBUILD_TESTS=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # The ten locale files are generated from tools/locales.json: this fails
      # if they were edited by hand, if a key is missing from a language, or if
      # a translation dropped a %1 placeholder.
      - name: Locales are in sync
        run: python3 tools/gen_locales.py --check
      # The plugin, the Stream Deck manifest and the CHANGELOG all name a
      # version; a release is only coherent if they name the same one.
      - name: Versions agree
        run: python3 tools/check_version.py
      # The README's compatibility table, obs-compat.json and OBS_VERSION are
      # three statements about the same thing; this is what stops them
      # disagreeing for months, and costs a second on every PR.
      - name: Compatibility declaration is in sync
        run: python3 tools/obs_compat.py --check
      - name: Compat matrix logic
        run: python3 -m unittest discover -s tools -p "test_*.py"

  # One package per Ubuntu release, each built in that release. The plugin links
  # the system FFmpeg, whose sonames change between releases (24.04 ships
  # libavformat.so.60, 26.04 libavformat.so.62), so a binary built on one does
  # not load on the other. OBS 32 ships for both; OBS 33 only for 26.04.
  linux:
    name: Linux x86_64 (Ubuntu ${{ matrix.ubuntu }})
    needs: tests
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    env:
      PACKAGE: obs-playlist-deck-linux-ubuntu-${{ matrix.ubuntu }}-x86_64.tar.gz
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Built against OBS's own .deb for OBS_VERSION on this Ubuntu, which
      # ships headers and CMake packages under /usr/local -- not Ubuntu's
      # libobs-dev. The two disagree on libobs's soname: Ubuntu 24.04's is
      # libobs.so.0, OBS's is libobs.so.30, and a plugin linked against the
      # first does not load into the OBS from the PPA or OBS's .deb. A missing
      # .deb (OBS 33 publishes none for 24.04) fails here, loudly, rather than
      # quietly building against something else.
      - name: Install OBS ${{ env.OBS_VERSION }} and build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates
          deb="OBS-Studio-${OBS_VERSION}-Ubuntu-${{ matrix.ubuntu }}-x86_64.deb"
          curl -fsSLO "https://github.com/obsproject/obs-studio/releases/download/${OBS_VERSION}/${deb}" \
            || { echo "::error::OBS ${OBS_VERSION} publishes no ${deb}"; exit 1; }
          DEBIAN_FRONTEND=noninteractive apt-get install -y "./${deb}" \
            qt6-base-dev qt6-svg-dev cmake ninja-build g++ pkg-config libsimde-dev \
            libavformat-dev libavutil-dev libcurl4-openssl-dev
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="/usr/local;/usr"
      - name: Build
        run: cmake --build build
      - name: Links against OBS's libobs
        run: |
          # The whole point of building against the .deb: verify it happened.
          needed="$(objdump -p build/src/plugin/obs-playlist-deck.so | awk '/NEEDED/ && /libobs/ {print $2}')"
          echo "$needed"
          echo "$needed" | grep -qx "libobs.so.30" \
            || { echo "::error::expected NEEDED libobs.so.30 (OBS's soname), got: $needed"; exit 1; }
      # The per-user layout (PLD_LINUX_LAYOUT=user, the default): the package
      # is extracted into $HOME, which every OBS searches whatever its install
      # prefix. See the install rules in src/plugin/CMakeLists.txt.
      - name: Install
        run: cmake --install build --prefix "$GITHUB_WORKSPACE/release"
      - name: Package
        run: |
          # Both layouts, or the package silently stops loading on one side of
          # OBS 33.
          new=.local/share/obs-studio/plugins/obs-playlist-deck
          legacy=.config/obs-studio/plugins/obs-playlist-deck
          for f in "$new/obs-playlist-deck.so" "$new/data/locale/en-US.ini" \
                   "$legacy/bin/64bit/obs-playlist-deck.so" "$legacy/data/locale/en-US.ini"; do
            [ -f "release/$f" ] || { echo "::error::missing from the package: ~/$f"; exit 1; }
          done
          # Only the two plugin folders, never "." or their parents: tar applies
          # an archived directory's mode on extraction, and this is unpacked
          # into the user's home.
          tar -czf "$PACKAGE" -C "$GITHUB_WORKSPACE/release" "$new" "$legacy"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obs-playlist-deck-linux-ubuntu-${{ matrix.ubuntu }}
          path: ${{ env.PACKAGE }}

  # Compiling against headers says nothing about whether the package loads
  # into the OBS people actually install. This installs OBS's own .deb for each
  # Ubuntu it ships for, unpacks our package over it, and resolves every symbol
  # the plugin imports (ldd -r). OBS_VERSION must pass; a newer beta is checked
  # and reported, but does not fail the run.
  linux-runtime:
    name: Linux — loads into the published OBS
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: packages
          pattern: obs-playlist-deck-linux-*
          merge-multiple: true
      - name: Resolve the OBS versions to check
        id: versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          beta="$(cd tools && python3 -c 'import os, obs_compat as c; print(c.qualifying_beta(c.fetch_tags(os.environ.get("GITHUB_TOKEN"))) or "")')"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
      - name: Check against each published OBS .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/linux-runtime-check.sh packages \
            "$OBS_VERSION" "${{ steps.versions.outputs.beta }}"

  windows:
    name: Windows x64
    needs: tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Qt and the prebuilt deps are OBS's own, for OBS_VERSION: the obs-deps
      # release its CMakePresets.json names. Qt used to come from aqtinstall at
      # a version typed in here (6.7.3), while OBS 32.2 ships 6.11.1 -- and the
      # Qt guard below was checked against a second hand-typed "6.7", so it
      # agreed with the mistake instead of catching it. OBS_QT_ABI now comes
      # from the obs-deps build script, a source independent of the Qt the
      # build actually finds, which is what makes the guard mean something.
      - name: Resolve OBS dependencies
        run: python tools/obs_deps.py --obs-version "${{ env.OBS_VERSION }}" --platform windows

      # --- OBS prebuilt deps and Qt (cached per obs-deps release) ---
      - name: Cache obs-deps
        id: cache-deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            C:\obs-deps
            C:\obs-deps-qt6
          key: obsdeps-win-x64-${{ env.OBS_DEPS_VERSION }}-qt6-${{ env.OBS_QT6_DEPS_VERSION }}-v2
      - name: Download OBS pre-built deps and Qt
        if: steps.cache-deps.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-Deps($release, $asset, $destination) {
            $raw = "C:\deps-raw\$asset"
            New-Item -ItemType Directory -Path $raw, $destination -Force | Out-Null
            gh release download $release --repo obsproject/obs-deps --pattern "$asset.zip" --dir $raw
            if ($LASTEXITCODE -ne 0) { throw "could not download $asset.zip from obs-deps $release" }
            Expand-Archive "$raw\$asset.zip" -DestinationPath "$raw\x"
            $top = Get-ChildItem "$raw\x"
            if ($top.Count -eq 1 -and $top[0].PSIsContainer) { $top = Get-ChildItem $top[0].FullName }
            $top | Move-Item -Destination $destination
          }
          Get-Deps $env:OBS_DEPS_VERSION "windows-deps-$env:OBS_DEPS_VERSION-x64" C:\obs-deps
          Get-Deps $env:OBS_QT6_DEPS_VERSION "windows-deps-qt6-$env:OBS_QT6_DEPS_VERSION-x64" C:\obs-deps-qt6
      - name: Qt environment
        shell: powershell
        run: |
          "Qt6_DIR=C:\obs-deps-qt6" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "C:\obs-deps-qt6\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # --- OBS dev libs (cached per OBS version and deps) ---
      # The expensive part: building libobs + obs-frontend-api from source. The
      # installed dev tree lives at the fixed path C:\obs-dev, so the cache stays
      # valid across runs (deps/Qt are also at fixed C:\ paths).
      - name: Cache OBS dev
        id: cache-obsdev
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: C:\obs-dev
          key: obsdev-win-${{ env.OBS_VERSION }}-${{ env.OBS_DEPS_VERSION }}-v2
      - name: Download OBS source
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          curl -L "https://github.com/obsproject/obs-studio/archive/refs/tags/%OBS_VERSION%.zip" -o obs.zip
          tar -xf obs.zip -C C:\
      # OBS 33: generate obs-core-modules.c with core modules off; see
      # obs-compat-probe. A no-op before 33.
      - name: Patch OBS source
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        shell: bash
        run: |
          perl -pi -e 's/^(\s*)set_property\(GLOBAL APPEND PROPERTY OBS_FEATURES_DISABLED "Core Modules"\)\s*$/$&$1set_obs_core_modules()\n/' \
            "/c/obs-studio-${OBS_VERSION}/plugins/CMakeLists.txt"
      - name: Configure OBS
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          rem ENABLE_CORE_MODULES is OBS 33's name for ENABLE_PLUGINS; see obs-compat-probe.
          cmake -B C:\obs-build -S "C:\obs-studio-${{ env.OBS_VERSION }}" -A x64 ^
            -DENABLE_PLUGINS=OFF ^
            -DENABLE_CORE_MODULES=OFF ^
            -DENABLE_SCRIPTING=OFF ^
            -DENABLE_BROWSER=OFF ^
            -DENABLE_UPDATER=OFF ^
            -DCMAKE_SYSTEM_VERSION=10.0 ^
            -DDepsPath="C:\obs-deps" ^
            -DFFMPEG_PATH="C:\obs-deps" ^
            -DQTDIR="%Qt6_DIR%" ^
            -DCMAKE_PREFIX_PATH="C:\obs-deps;%Qt6_DIR%"
      - name: Build OBS
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        run: cmake --build C:\obs-build --target obs-frontend-api --config Release --parallel
      - name: Install OBS dev
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        run: cmake --install C:\obs-build --config Release --component Development --prefix C:\obs-dev
      - name: Configure plugin
        shell: cmd
        run: |
          cmake -B build -S . -A x64 ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_TESTS=OFF ^
            -DPLD_EXPECTED_QT=%OBS_QT_ABI% ^
            -DCMAKE_PREFIX_PATH="C:\obs-dev;%Qt6_DIR%;C:\obs-deps"
      - name: Build plugin
        run: cmake --build build --config Release
      # The install tree IS the package: one obs-playlist-deck folder holding
      # the OBS 33 layout (obs-playlist-deck.dll next to data\) and the legacy
      # one (bin\64bit\) for OBS 32 and earlier. It is meant to be extracted
      # into C:\ProgramData\obs-studio\plugins -- the only per-install folder
      # OBS searches on Windows.
      - name: Install plugin
        run: cmake --install build --config Release --prefix "${{ github.workspace }}\pkg"
      - name: Package (C:\ProgramData\obs-studio\plugins layout, OBS 33 + legacy)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dst = "${{ github.workspace }}\pkg\obs-playlist-deck"
          foreach ($f in 'obs-playlist-deck.dll', 'bin\64bit\obs-playlist-deck.dll', 'data\locale\en-US.ini') {
            if (-not (Test-Path "$dst\$f")) { throw "missing from the package: obs-playlist-deck\$f" }
          }
          Compress-Archive -Path $dst -DestinationPath "${{ github.workspace }}\obs-playlist-deck-windows.zip" -Force
      # The installer packs the very same tree into the same folder
      # (installer/obs-playlist-deck.iss). Its version is read from
      # CMakeLists.txt, like the macOS bundle's, so it cannot drift.
      - name: Build installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(obs-playlist-deck VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if (-not $version) { throw "could not read the project version" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" `
            "/DPkgDir=${{ github.workspace }}\pkg" "/O${{ github.workspace }}" installer\obs-playlist-deck.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          "INSTALLER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Not a build check: the installer is run for real on the runner, the
      # way a user would, and what it leaves on disk is inspected. Install,
      # install again over it (the upgrade path), uninstall.
      - name: Installer really installs, upgrades and uninstalls
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "${{ github.workspace }}\obs-playlist-deck-windows-setup.exe"
          $app = "$env:ProgramData\obs-studio\plugins\obs-playlist-deck"
          $legacy = "$env:APPDATA\obs-studio\plugins\obs-playlist-deck"
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{5F029470-E628-4130-9BF0-C62083EEA147}_is1'
          # A dead copy where 1.3.2's README put it: the default task removes it.
          New-Item -ItemType Directory -Force -Path "$legacy\bin\64bit" | Out-Null
          Set-Content "$legacy\bin\64bit\obs-playlist-deck.dll" 'stale'
          foreach ($pass in 'install', 'upgrade') {
            $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup-$pass.log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-$pass.log"; throw "$pass exited with $($p.ExitCode)" }
            foreach ($f in 'obs-playlist-deck.dll', 'bin\64bit\obs-playlist-deck.dll', 'data\locale\en-US.ini', 'uninstall\unins000.exe') {
              if (-not (Test-Path "$app\$f")) { throw "after $pass, missing: $app\$f" }
            }
            $shipped = (Get-FileHash "${{ github.workspace }}\pkg\obs-playlist-deck\obs-playlist-deck.dll").Hash
            foreach ($dll in "$app\obs-playlist-deck.dll", "$app\bin\64bit\obs-playlist-deck.dll") {
              if ((Get-FileHash $dll).Hash -ne $shipped) { throw "after $pass, $dll is not the built plugin" }
            }
            $shown = (Get-ItemProperty $key).DisplayVersion
            if ($shown -ne $env:INSTALLER_VERSION) { throw "Apps & features shows $shown, expected $env:INSTALLER_VERSION" }
            "ok: $pass"
          }
          if (Test-Path $legacy) { throw "the %APPDATA% copy was not removed" }
          "ok: the %APPDATA% copy was removed"
          # The uninstaller relaunches itself from %TEMP% and returns at once,
          # so wait for its effect rather than for the process.
          Start-Process "$app\uninstall\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path $app) -or (Test-Path $key)) {
            if ((Get-Date) -gt $deadline) { throw "uninstall left $app or its Apps & features entry behind" }
            Start-Sleep -Seconds 2
          }
          "ok: uninstalled, nothing left behind"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obs-playlist-deck-windows
          path: |
            obs-playlist-deck-windows.zip
            obs-playlist-deck-windows-setup.exe

  macos:
    name: macOS universal
    needs: tests
    # macos-26, not macos-15: OBS 32.2's build refuses an SDK older than macOS
    # 26.5 ("Your macOS SDK version is too low"), and macos-15 ships 15.5. The
    # image is pinned rather than left at macos-latest so a runner-image
    # rotation cannot silently change what the shipped binary is built against.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        run: brew install cmake ninja
      # OBS's own deps and Qt for OBS_VERSION; see the Windows job.
      - name: Resolve OBS dependencies
        run: python3 tools/obs_deps.py --obs-version "${{ env.OBS_VERSION }}" --platform macos

      # --- OBS prebuilt universal deps (cached) ---
      - name: Cache obs-deps
        id: cache-deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /tmp/obs-deps
            /tmp/obs-deps-qt6
          key: obsdeps-mac-universal-${{ env.OBS_DEPS_VERSION }}-qt6-${{ env.OBS_QT6_DEPS_VERSION }}-v2
      - name: Download universal OBS pre-built deps
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/obs-deps /tmp/obs-deps-qt6
          curl -fsSL \
            "https://github.com/obsproject/obs-deps/releases/download/${{ env.OBS_DEPS_VERSION }}/macos-deps-${{ env.OBS_DEPS_VERSION }}-universal.tar.xz" \
            | tar -xJ -C /tmp/obs-deps
          curl -fsSL \
            "https://github.com/obsproject/obs-deps/releases/download/${{ env.OBS_QT6_DEPS_VERSION }}/macos-deps-qt6-${{ env.OBS_QT6_DEPS_VERSION }}-universal.tar.xz" \
            | tar -xJ -C /tmp/obs-deps-qt6

      # --- OBS dev libs (universal, cached per OBS version) ---
      # The expensive part: building libobs + obs-frontend-api universal from
      # source. The installed dev tree lives at the fixed path /tmp/obs-dev, so
      # the cache stays valid across runs (deps are also at fixed /tmp paths).
      - name: Cache OBS dev
        id: cache-obsdev
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/obs-dev
          # The deployment target is part of the key: a prefix built for an
          # older minimum (or on the previous runner image, which had no
          # explicit target at all) must never be restored into a build that
          # promises a different one.
          key: obsdev-mac-universal-${{ env.OBS_VERSION }}-${{ env.OBS_DEPS_VERSION }}-${{ env.MACOS_DEPLOYMENT_TARGET }}-v3
      - name: Clone OBS source
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --branch ${{ env.OBS_VERSION }} \
            https://github.com/obsproject/obs-studio.git /tmp/obs
          # libobs-metal is a Swift-only target and OBS never enables the Swift
          # language, which breaks CMake generate ("can not determine linker
          # language"). It is a runtime graphics module nothing here links, so
          # drop it; we only need libobs + obs-frontend-api dev files.
          sed -i.bak 's/^\( *\)add_subdirectory(libobs-metal)/\1# disabled for dev build: add_subdirectory(libobs-metal)/' /tmp/obs/CMakeLists.txt
          # OBS 33: generate obs-core-modules.c with core modules off; see
          # obs-compat-probe. A no-op before 33.
          perl -pi -e 's/^(\s*)set_property\(GLOBAL APPEND PROPERTY OBS_FEATURES_DISABLED "Core Modules"\)\s*$/$&$1set_obs_core_modules()\n/' \
            /tmp/obs/plugins/CMakeLists.txt
      - name: Configure OBS (universal)
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        run: |
          cmake -B /tmp/obs-build -S /tmp/obs \
            -G Xcode \
            -DENABLE_PLUGINS=OFF \
            -DENABLE_CORE_MODULES=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_BROWSER=OFF \
            -DENABLE_VLC=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)" \
            -DCMAKE_PREFIX_PATH="/tmp/obs-deps-qt6;/tmp/obs-deps"
      - name: Build OBS
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        run: cmake --build /tmp/obs-build --target obs-frontend-api --config Release --parallel
      - name: Install OBS dev
        if: steps.cache-obsdev.outputs.cache-hit != 'true'
        run: cmake --install /tmp/obs-build --config Release --component Development --prefix /tmp/obs-dev
      - name: Configure plugin (universal)
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DPLD_EXPECTED_QT="$OBS_QT_ABI" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            -Dlibobs_DIR="/tmp/obs-dev/Frameworks/libobs.framework/Resources/cmake" \
            -Dobs-frontend-api_DIR="/tmp/obs-dev/lib/cmake/obs-frontend-api" \
            -DQt6_DIR="/tmp/obs-deps-qt6/lib/cmake/Qt6" \
            -DCMAKE_PREFIX_PATH="/tmp/obs-dev;/tmp/obs-deps-qt6;/tmp/obs-deps"
      - name: Build plugin
        run: cmake --build build
      - name: Install plugin
        run: DESTDIR="${{ github.workspace }}/release" cmake --install build
      - name: Package .plugin (universal, @rpath Qt)
        run: |
          # The bundle version is read from CMakeLists rather than typed in:
          # it was left at an old release for two versions running.
          version="$(sed -n 's/.*project(obs-playlist-deck VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$version" ] || { echo "could not read the project version"; exit 1; }
          bundle="macos-package/obs-playlist-deck.plugin"
          mkdir -p "$bundle/Contents/MacOS" "$bundle/Contents/Resources"

          binary_src="$(find "${{ github.workspace }}/release" -type f -name 'libobs-playlist-deck.*' -print -quit)"
          data_dir="$(find "${{ github.workspace }}/release" -type d -path '*/obs-playlist-deck' -print -quit)"

          if [ -z "$binary_src" ]; then
            echo "Could not find the built macOS plugin binary"
            find "${{ github.workspace }}/release" -maxdepth 6 -type f -print
            exit 1
          fi

          cp "$binary_src" "$bundle/Contents/MacOS/obs-playlist-deck"
          [ -n "$data_dir" ] && cp -R "$data_dir"/. "$bundle/Contents/Resources/"
          chmod +x "$bundle/Contents/MacOS/obs-playlist-deck"
          binary="$bundle/Contents/MacOS/obs-playlist-deck"

          cat > "$bundle/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key><string>en</string>
            <key>CFBundleExecutable</key><string>obs-playlist-deck</string>
            <key>CFBundleIdentifier</key><string>com.angeloruggieridj.obs-playlist-deck</string>
            <key>CFBundleName</key><string>Playlist Deck</string>
            <key>CFBundlePackageType</key><string>BNDL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>${{ env.MACOS_DEPLOYMENT_TARGET }}</string>
          </dict>
          </plist>
          PLIST
          printf 'BNDL????' > "$bundle/Contents/PkgInfo"

          # Rewrite absolute Qt install names to @rpath so the plugin resolves
          # Qt from OBS.app's bundled frameworks on any machine.
          # Qt frameworks: rewrite absolute install names to @rpath/<Framework>.framework/...
          otool -L "$binary" | awk 'NR>1{print $1}' \
            | grep -E '/Qt[A-Za-z]+\.framework/' \
            | grep -v '^@rpath/' \
            | while read -r dep; do
                new="$(printf '%s' "$dep" | sed -E 's#^.*/(Qt[A-Za-z]+\.framework/.*)$#@rpath/\1#')"
                echo "Rewriting $dep -> $new"
                install_name_tool -change "$dep" "$new" "$binary"
              done

          # Other build-machine dylibs (e.g. ffmpeg libav*) shipped inside OBS.app:
          # rewrite their absolute install names to @rpath/<basename> so they
          # resolve from OBS.app's bundled frameworks at runtime.
          otool -L "$binary" | awk 'NR>1{print $1}' \
            | grep -E '^(/tmp/|/opt/homebrew/|/usr/local/)' \
            | grep -vE '\.framework/' \
            | while read -r dep; do
                new="@rpath/$(basename "$dep")"
                echo "Rewriting $dep -> $new"
                install_name_tool -change "$dep" "$new" "$binary"
              done

          if otool -L "$binary" | awk 'NR>1{print $1}' \
               | grep -E '^(/tmp/|/opt/homebrew/|/usr/local/)'; then
            echo "Absolute build-machine install names leaked into the macOS plugin bundle"
            exit 1
          fi

          archs="$(lipo -archs "$binary")"
          echo "binary archs: $archs"
          echo "$archs" | grep -q x86_64 && echo "$archs" | grep -q arm64 \
            || { echo "binary is not universal (x86_64 + arm64)"; exit 1; }

          codesign --force --sign - "$binary"
          codesign --force --deep --sign - "$bundle"

          tar -czf obs-playlist-deck-macos-universal.tar.gz -C macos-package obs-playlist-deck.plugin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obs-playlist-deck-macos
          path: obs-playlist-deck-macos-universal.tar.gz

  # What OBS versions this plugin supports is derived here, not asserted by
  # hand: one probe per OBS minor, a contiguity rule, and a manifest the README
  # is generated from. See docs/superpowers/specs/2026-08-31-obs-compat-matrix-design.md
  compat-discover:
    name: OBS compat — discover
    # No `needs: tests` here, deliberately. This job answers a question about
    # OBS SDK compatibility, which does not depend on the plugin's unit tests
    # passing — and on the first-ever run there is no obs-compat.json yet, so
    # `tests --check` fails, and GitHub Actions skips every job downstream of
    # a failed dependency regardless of that job's own `if:`. A `needs: tests`
    # here made the pipeline unable to ever produce the manifest its own gate
    # requires: a bootstrap deadlock (see run 33595508885). The release gate
    # is unaffected — the `release` job below still needs both `tests` and
    # `compat-report`, so a failing test suite still blocks a release. The
    # rejected alternative was softening the `tests` --check step to tolerate
    # a missing manifest, which would let a *deleted* manifest pass silently;
    # this project spent nine tasks removing exactly that kind of silence, so
    # `tests` stays untouched. The bounded cost: on a dispatch, schedule or
    # tag push where unit tests are failing, the matrix still runs and burns
    # CI. It never runs on push or pull request, so the waste is limited, and
    # the compatibility result it produces is still true regardless.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      run_full: ${{ steps.discover.outputs.run_full }}
      native: ${{ steps.discover.outputs.native }}
      jammy: ${{ steps.discover.outputs.jammy }}
      grid: ${{ steps.discover.outputs.grid }}
      latest_stable: ${{ steps.discover.outputs.latest_stable }}
      beta: ${{ steps.discover.outputs.beta }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Which cron fired: the weekly one always runs the full matrix.
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: python3 tools/obs_compat.py --discover

  compat:
    name: OBS compat ${{ matrix.obs }}
    needs: compat-discover
    if: needs.compat-discover.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compat-discover.outputs.native) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config extra-cmake-modules \
            qt6-base-dev qt6-base-private-dev qt6-svg-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev \
            libavfilter-dev libswscale-dev libswresample-dev libx264-dev \
            libcurl4-openssl-dev libjansson-dev libmbedtls-dev libsimde-dev \
            uthash-dev nlohmann-json3-dev zlib1g-dev libpng-dev \
            libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev \
            libgles2-mesa-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-xinerama0-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-composite0-dev libxcb-xinput-dev \
            libxfixes-dev libxcomposite-dev libxinerama-dev libxss-dev \
            libdrm-dev libva-dev libxcb-cursor-dev \
            libqrcodegencpp-dev librist-dev libsrt-openssl-dev \
            libfontconfig1-dev libfreetype-dev \
            libpci-dev libpulse-dev libudev-dev libasound2-dev
      - uses: ./.github/actions/obs-compat-probe
        with:
          obs-version: ${{ matrix.obs }}
          env-name: native

  # ubuntu-24.04 ships FFmpeg 7, which OBS 30-era code does not build against.
  # That is an OBS build problem, not a plugin one, so the older SDKs are built
  # in jammy rather than written off as incompatible.
  compat-legacy:
    name: OBS compat ${{ matrix.obs }} (jammy)
    needs: compat-discover
    if: >-
      needs.compat-discover.outputs.run_full == 'true' &&
      needs.compat-discover.outputs.jammy != '[]'
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compat-discover.outputs.jammy) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install build deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git cmake ninja-build pkg-config extra-cmake-modules g++ \
            qt6-base-dev qt6-base-private-dev libqt6svg6-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavdevice-dev \
            libavfilter-dev libswscale-dev libswresample-dev libx264-dev \
            libcurl4-openssl-dev libjansson-dev libmbedtls-dev \
            uthash-dev nlohmann-json3-dev zlib1g-dev libpng-dev \
            libpipewire-0.3-dev libwayland-dev libxkbcommon-dev libgl1-mesa-dev \
            libgles2-mesa-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-xinerama0-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-composite0-dev libxcb-xinput-dev \
            libxfixes-dev libxcomposite-dev libxinerama-dev libxss-dev \
            libdrm-dev libva-dev libxcb-cursor-dev \
            libfontconfig1-dev libfreetype-dev \
            libpci-dev libpulse-dev libudev-dev libasound2-dev
      - uses: ./.github/actions/obs-compat-probe
        with:
          obs-version: ${{ matrix.obs }}
          env-name: jammy

  compat-report:
    name: OBS compat — report
    needs: [compat-discover, compat, compat-legacy]
    if: always() && needs.compat-discover.outputs.run_full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: compat-artifacts
          pattern: compat-*
      # --report only ever writes a fresh obs-compat.json when it can derive
      # a range (see save_manifest in _report). On EXIT_NO_RANGE it returns
      # before that write, and checkout above left the *committed* manifest
      # sitting at this same path -- indistinguishable, to the upload step
      # below, from a genuinely fresh one. Removing it first means a
      # no-range run uploads nothing rather than a stale file that looks
      # current: "no files were found" in the log instead of a silent lie.
      - name: Remove the committed manifest so a no-range run cannot pass it off as fresh
        run: rm -f obs-compat.json
      - name: Derive the supported range
        run: |
          python3 tools/obs_compat.py --report \
            --artifacts compat-artifacts \
            --grid '${{ needs.compat-discover.outputs.grid }}' \
            --latest-stable '${{ needs.compat-discover.outputs.latest_stable }}' \
            --beta '${{ needs.compat-discover.outputs.beta }}'
      # See tools/obs_compat.py's UPDATE_INSTRUCTIONS for the three steps a
      # human needs after a non-zero exit here: this artifact is what step 1
      # downloads. It is absent, not stale, when the step above didn't run.
      - name: Upload the manifest as it would be written
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obs-compat-manifest
          path: obs-compat.json
          if-no-files-found: warn

  # Stream Deck companion packaging: installable zip + Elgato .streamDeckPlugin,
  # published as public release assets.
  streamdeck:
    name: Stream Deck companion
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Render icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin zip
          cd "streamdeck/com.angeloruggieridj.playlist-deck.sdPlugin/icons"
          for f in *.svg; do
            n="${f%.svg}"
            rsvg-convert -w 72  -h 72  "$f" -o "$n.png"
            rsvg-convert -w 144 -h 144 "$f" -o "$n@2x.png"
          done
      - name: Package .sdPlugin (zip)
        run: |
          cd "${{ github.workspace }}/streamdeck"
          zip -r "${{ github.workspace }}/obs-playlist-deck-streamdeck.zip" com.angeloruggieridj.playlist-deck.sdPlugin
      - name: Package .streamDeckPlugin (Elgato CLI)
        run: |
          npm install -g @elgato/cli >/dev/null 2>&1 || true
          cd "${{ github.workspace }}/streamdeck"
          streamdeck pack com.angeloruggieridj.playlist-deck.sdPlugin --output "${{ github.workspace }}" || \
            echo "streamdeck pack unavailable/failed; zip artifact still produced"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obs-playlist-deck-streamdeck
          path: |
            obs-playlist-deck-streamdeck.zip
            *.streamDeckPlugin

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - tests
      - linux
      - linux-runtime
      - windows
      - macos
      - streamdeck
      - compat-report
    runs-on: ubuntu-24.04
    # contents: write publishes the release; the other two let the job mint a
    # build provenance attestation, which is signed with an OIDC token.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # Optional: without it the VirusTotal step is skipped, not failed.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      # Checkout first: download-artifact writes into the workspace and checkout
      # would wipe it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-assets
          # Without this, a tag push also pulls in the ten compat-probe JSON
          # artifacts (compat-*, obs-compat-manifest) alongside the actual
          # packages. They are not release assets, but merge-multiple with no
          # pattern cannot tell the difference -- they landed in
          # release-assets/ and were signed into the build-provenance
          # attestation below via subject-path: release-assets/*, silently
          # changing what that attestation's subject set means.
          pattern: obs-playlist-deck-*
          merge-multiple: true
      # The release body is this version's CHANGELOG section, not GitHub's
      # auto-generated commit list.
      - name: Release notes from CHANGELOG
        run: |
          bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no CHANGELOG section for $GITHUB_REF_NAME; linking the file instead"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md
      # None of the packages are code-signed, so ship something people can check
      # instead: an attestation binding every asset to this workflow, this commit
      # and this runner. A SHA256SUMS file would add nothing - GitHub already
      # publishes a sha256 digest per release asset, from the same source, and
      # the attestation covers each asset directly rather than by proxy.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          files: |
            release-assets/obs-playlist-deck-linux-ubuntu-24.04-x86_64.tar.gz
            release-assets/obs-playlist-deck-linux-ubuntu-26.04-x86_64.tar.gz
            release-assets/obs-playlist-deck-windows.zip
            release-assets/obs-playlist-deck-windows-setup.exe
            release-assets/obs-playlist-deck-macos-universal.tar.gz
            release-assets/obs-playlist-deck-streamdeck.zip
            release-assets/*.streamDeckPlugin
      # An independent second opinion, linked from the release page. Needs a free
      # VirusTotal API key in the VT_API_KEY secret; without one this is skipped
      # and the release still publishes.
      - name: Scan the packages with VirusTotal
        id: vt
        if: ${{ env.VT_API_KEY != '' }}
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            release-assets/obs-playlist-deck-linux-ubuntu-24.04-x86_64.tar.gz
            release-assets/obs-playlist-deck-linux-ubuntu-26.04-x86_64.tar.gz
            release-assets/obs-playlist-deck-windows.zip
            release-assets/obs-playlist-deck-windows-setup.exe
            release-assets/obs-playlist-deck-macos-universal.tar.gz
            release-assets/obs-playlist-deck-streamdeck.zip
      # The action's own update_release_body only fires on a "release" event, and
      # this workflow runs on a tag push, so append the reports here instead.
      - name: Link the VirusTotal reports from the release
        if: ${{ steps.vt.outputs.analysis != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
        run: |
          {
            echo ''
            echo '### Verification'
            echo ''
            echo '- **Integrity**: compare against the sha256 digest GitHub publishes for each asset.'
            echo "- **Provenance**: \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
            echo '- **VirusTotal**:'
            # analysis is "path=url" pairs joined by commas; the URLs carry none.
            IFS=',' read -ra rows <<< "$ANALYSIS"
            for row in "${rows[@]}"; do
              echo "  - [$(basename "${row%%=*}")](${row#*=})"
            done
          } >> release-notes.md
          cat release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md

name: OBS compat probe
description: Build one OBS SDK and compile the plugin against it, recording the outcome.

inputs:
  obs-version:
    description: OBS tag to build against, e.g. 30.0.0 or 32.2.0-beta1
    required: true
  env-name:
    description: native or jammy — recorded in the result, and part of the cache key
    required: true

runs:
  using: composite
  steps:
    # Every failure below is caught and recorded rather than thrown, because
    # the phase is the whole point: an SDK that will not build says nothing
    # about the plugin, and must never be reported as an incompatibility.
    - name: Cache OBS dev
      id: cache-obsdev
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: /tmp/obs-dev
        key: obsdev-linux-${{ inputs.obs-version }}-${{ inputs.env-name }}-v2

    - name: Build OBS dev
      id: obs-build
      if: steps.cache-obsdev.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -o pipefail
        status=ok
        {
          # These are chained with && rather than run as separate statements.
          # set -e would be the obvious fix for "one early failure shouldn't
          # let a later command's success paper over it", but it does not
          # work here: bash ignores errexit for every command that is not
          # the pipeline's last stage, and this whole group is stage one of
          # a pipe into tail — that exemption reaches inside the group too.
          # && has no such exemption: a failing clone/configure/build stops
          # the chain right there, so the group's exit code is the real
          # failure's, not whatever the trailing command happened to return.
          git clone --depth=1 --branch "${{ inputs.obs-version }}" \
            https://github.com/obsproject/obs-studio.git /tmp/obs &&
          # OBS 32.2's Linux helper calls add_dependencies(obs-studio <execs> <mods>),
          # which errors when both lists are empty — as they are here, since only
          # obs-frontend-api is built. Harmless on versions without the call.
          { sed -i 's|add_dependencies(${target} ${obs_executables} ${obs_modules})|if(obs_executables OR obs_modules)\n      add_dependencies(${target} ${obs_executables} ${obs_modules})\n    endif()|' \
              /tmp/obs/cmake/linux/helpers.cmake || true; } &&
          cmake -B /tmp/obs-build -S /tmp/obs -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=OFF \
            -DENABLE_PLUGINS=OFF -DENABLE_SCRIPTING=OFF \
            -DENABLE_BROWSER=OFF -DENABLE_VLC=OFF &&
          cmake --build /tmp/obs-build --target obs-frontend-api --parallel &&
          # The install component holding development files (headers, the
          # shared library, the cmake package config) is not named
          # consistently across OBS versions: 30.0.0 installs it under
          # obs_libraries, later versions under Development. A lookup table
          # keyed on version would be extrapolation from a single verified
          # data point, so instead try both and tolerate whichever this
          # version does not define. cmake --install exits 0 either way —
          # an unrecognized --component silently installs nothing rather
          # than erroring — so neither install's exit status settles
          # anything; the header check in the next step is what decides.
          { cmake --install /tmp/obs-build --component Development --prefix /tmp/obs-dev || true; } &&
          { cmake --install /tmp/obs-build --component obs_libraries --prefix /tmp/obs-dev || true; }
        } 2>&1 | tail -200 || status=fail
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Verify OBS dev headers
      id: obs-verify
      shell: bash
      run: |
        # This step is unconditional (no `if:`) because it must also cover
        # the cache-hit path, where "Build OBS dev" above never ran at all —
        # a cached prefix from a prior broken run must not sail through
        # unexamined. A prior hard failure short-circuits it below; a clean
        # cache-hit or a clean build both fall through to the same proof.
        if [ "${{ steps.obs-build.outputs.status }}" = "fail" ]; then
          echo "status=fail" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A green install (or a cache hit) is not evidence anything is
        # actually there: an unrecognized --component silently installs
        # nothing and still exits 0. The only proof that counts is the
        # header the plugin actually needs, found on disk under its own
        # name — never a pipeline's exit code, which is exactly what let a
        # broken prefix report success before.
        found="$(find /tmp/obs-dev -type f -name obs-frontend-api.h -print -quit)"
        if [ -n "$found" ]; then
          echo "status=ok" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::obs-frontend-api.h not found under /tmp/obs-dev; treating as an obs-build failure"
          echo "status=fail" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the plugin against it
      id: plugin
      if: steps.obs-verify.outputs.status != 'fail'
      shell: bash
      run: |
        set -o pipefail
        status=ok
        {
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="/tmp/obs-dev;/usr"
          cmake --build build
        } 2>&1 | tail -200 || status=fail
        echo "status=$status" >> "$GITHUB_OUTPUT"

    - name: Record the outcome
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.obs-verify.outputs.status }}" = "fail" ]; then
          status=fail; phase=obs-build
        elif [ "${{ steps.plugin.outputs.status }}" = "fail" ]; then
          status=fail; phase=plugin-build
        else
          status=ok; phase=null
        fi
        printf '{"obs":"%s","status":"%s","phase":%s,"env":"%s"}\n' \
          "${{ inputs.obs-version }}" "$status" \
          "$([ "$phase" = null ] && echo null || echo "\"$phase\"")" \
          "${{ inputs.env-name }}" > "compat-${{ inputs.obs-version }}.json"
        cat "compat-${{ inputs.obs-version }}.json"
        [ "$status" = ok ] || echo "::warning::probe ${{ inputs.obs-version }} failed at $phase"

    - name: Upload the result
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: compat-${{ inputs.obs-version }}
        path: compat-${{ inputs.obs-version }}.json

    # The result is recorded and uploaded above; whether it should fail the
    # workflow is the caller's decision, made with continue-on-error from
    # the required flag. This step only fails the probe's own job step.
    - name: Fail if the probe failed
      if: always()
      shell: bash
      run: |
        [ "${{ steps.obs-verify.outputs.status }}" != "fail" ] || exit 1
        [ "${{ steps.plugin.outputs.status }}" != "fail" ] || exit 1

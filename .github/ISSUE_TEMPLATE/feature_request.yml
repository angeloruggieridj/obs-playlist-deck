name: Feature request
description: Suggest something the deck should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution: what you are producing, and what the
        deck makes awkward today. That is what decides whether a feature earns
        its place in a dock this narrow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional. If you already know the shape it should take, describe it.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Workarounds, other tools, or the manual steps this would replace.

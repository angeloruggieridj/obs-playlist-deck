name: Bug report
description: Something in the deck behaves differently from what it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: the plugin logs to OBS's own log (Help → Log Files → Show
        Log Files). Lines from this plugin are prefixed `[obs-playlist-deck]`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Bound the deck to "Media 1" (a VLC source)
        2. Double-clicked the second item
        3. Expected it to play; the source kept playing the previous clip
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Playlist Deck version
      description: Shown at the bottom right of the dock.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: obs
    attributes:
      label: OBS Studio version
      placeholder: "32.1.2"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS (Apple Silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Which source is bound
      description: Media Source (ffmpeg) or VLC Source, and whether it is in a scene that is on air.
      placeholder: "VLC Source, in the scene currently in Program"
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: Anything prefixed `[obs-playlist-deck]`, plus whatever is around a crash.
      render: text

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 590" width="344" height="590" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <title>Playlist Deck — OBS dock</title>
  <desc>Mockup of the Playlist Deck dock docked in OBS Studio (dark theme). All source, playlist and clip names shown are fictitious.</desc>

  <defs>
    <!-- Feather-style icons in their native 24x24 space; tinted to ButtonText. -->
    <g id="ic-library" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
    </g>
    <g id="ic-refresh" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
    </g>
    <g id="ic-music" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>
    </g>
    <g id="ic-pause" fill="#cfd1d4" stroke="none">
      <rect x="7" y="5" width="3.2" height="14" rx="1"/><rect x="13.8" y="5" width="3.2" height="14" rx="1"/>
    </g>
    <g id="ic-skipback" fill="#cfd1d4" stroke="none">
      <polygon points="19 5 9 12 19 19"/><rect x="5" y="5" width="2.2" height="14" rx="1"/>
    </g>
    <g id="ic-stop" fill="#cfd1d4" stroke="none"><rect x="6" y="6" width="12" height="12" rx="1.5"/></g>
    <g id="ic-skipfwd" fill="#cfd1d4" stroke="none">
      <polygon points="5 5 15 12 5 19"/><rect x="16.8" y="5" width="2.2" height="14" rx="1"/>
    </g>
    <g id="ic-volume" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4 9 8 9 13 5 13 19 8 15 4 15" fill="#cfd1d4" stroke="none"/>
      <path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 5.5a9 9 0 0 1 0 13"/>
    </g>
    <g id="ic-panic" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
    </g>
    <g id="ic-play" fill="#cfd1d4" stroke="none"><path d="M7 4 L20 12 L7 20 Z"/></g>
    <g id="ic-plus" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </g>
    <g id="ic-minus" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="5" y1="12" x2="19" y2="12"/>
    </g>
    <g id="ic-chevup" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 15 12 9 18 15"/>
    </g>
    <g id="ic-chevdown" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </g>
    <g id="ic-pencil" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
    </g>
    <g id="ic-trash" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </g>
    <g id="ic-undo" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>
    </g>
    <g id="ic-save" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
    </g>
    <g id="ic-folder" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    </g>
    <g id="ic-settings" fill="none" stroke="#cfd1d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </g>
    <g id="ic-search" fill="none" stroke="#8b8f95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
    </g>
  </defs>

  <!-- ===== OBS dock frame ===== -->
  <rect x="0.5" y="0.5" width="343" height="589" rx="6" fill="#26292e" stroke="#141619"/>

  <!-- Dock title bar -->
  <path d="M1 7a6 6 0 0 1 6-6h330a6 6 0 0 1 6 6v21H1z" fill="#1b1d21"/>
  <line x1="1" y1="28" x2="343" y2="28" stroke="#141619"/>
  <text x="12" y="18.5" font-size="12" font-weight="600" fill="#c7c9cc">Playlist Deck</text>
  <g fill="none" stroke="#7f8388" stroke-width="1.4" stroke-linecap="round">
    <rect x="304.5" y="10.5" width="9" height="8" rx="1"/>
    <path d="M322 10l9 9M331 10l-9 9"/>
  </g>

  <!-- ===== Playlist library row ===== -->
  <text x="9" y="52" font-size="11" fill="#9a9ea3">Playlist</text>
  <rect x="56" y="34" width="249" height="28" rx="5" fill="#202327" stroke="#3a3e44"/>
  <text x="66" y="52" font-size="12" fill="#e7e8ea">Main Set<tspan fill="#6f7378">   ●</tspan></text>
  <use href="#ic-chevdown" transform="translate(285,42) scale(0.5)"/>
  <rect x="309" y="34" width="28" height="28" rx="5" fill="none"/>
  <use href="#ic-library" transform="translate(315,40) scale(0.6667)"/>

  <!-- ===== Media source row ===== -->
  <text x="9" y="85" font-size="11" fill="#9a9ea3">Media source</text>
  <rect x="92" y="67" width="213" height="28" rx="5" fill="#202327" stroke="#3a3e44"/>
  <text x="102" y="85" font-size="12" fill="#e7e8ea">PGM — Media Source</text>
  <use href="#ic-chevdown" transform="translate(285,75) scale(0.5)"/>
  <use href="#ic-refresh" transform="translate(315,73) scale(0.6667)"/>

  <!-- ===== Now-playing card ===== -->
  <rect x="7" y="100" width="330" height="99" rx="5" fill="#31353b" stroke="#3f444b"/>
  <use href="#ic-music" transform="translate(15,107) scale(0.6667)"/>
  <text x="37" y="119" font-size="12.5" font-weight="700" fill="#e9eaec">Sponsor Reel — Acme Corp</text>
  <text x="329" y="119" font-size="11" text-anchor="end" fill="#9a9ea3">1:30</text>

  <!-- seek bar -->
  <rect x="15" y="128" width="314" height="4" rx="2" fill="#3f444b"/>
  <rect x="15" y="128" width="141" height="4" rx="2" fill="#4f8cff"/>
  <circle cx="156" cy="130" r="5" fill="#4f8cff"/>

  <!-- time + up next -->
  <text x="15" y="152" font-size="11" fill="#b9bcc0" font-family="Consolas, 'SF Mono', Menlo, monospace">0:41 / 1:30<tspan dx="14">-0:49</tspan></text>
  <text x="329" y="152" font-size="11" text-anchor="end" fill="#9a9ea3">then: Halftime Bumper</text>

  <!-- transport row -->
  <use href="#ic-skipback" transform="translate(21,166) scale(0.6667)"/>
  <rect x="46" y="160" width="28" height="28" rx="5" fill="#2a2e34"/>
  <use href="#ic-pause"    transform="translate(52,166) scale(0.6667)"/>
  <use href="#ic-stop"     transform="translate(83,166) scale(0.6667)"/>
  <use href="#ic-skipfwd"  transform="translate(114,166) scale(0.6667)"/>
  <use href="#ic-volume"   transform="translate(145,166) scale(0.6667)"/>
  <use href="#ic-panic"    transform="translate(276,166) scale(0.6667)"/>
  <use href="#ic-play"     transform="translate(307,166) scale(0.6667)"/>

  <!-- ===== Filter ===== -->
  <rect x="7" y="204" width="330" height="28" rx="5" fill="#202327" stroke="#3a3e44"/>
  <use href="#ic-search" transform="translate(15,212) scale(0.6667)"/>
  <text x="36" y="222" font-size="12" fill="#7f8388">Filter…</text>

  <!-- ===== Playlist ===== -->
  <rect x="7" y="237" width="330" height="208" rx="5" fill="#202327" stroke="#3a3e44"/>
  <clipPath id="listclip"><rect x="8" y="238" width="328" height="206" rx="4"/></clipPath>
  <g clip-path="url(#listclip)" font-size="12">
    <!-- row separators -->
    <g stroke="#ffffff" stroke-opacity="0.04">
      <line x1="8" y1="263" x2="336" y2="263"/><line x1="8" y1="289" x2="336" y2="289"/>
      <line x1="8" y1="315" x2="336" y2="315"/><line x1="8" y1="341" x2="336" y2="341"/>
      <line x1="8" y1="367" x2="336" y2="367"/><line x1="8" y1="393" x2="336" y2="393"/>
      <line x1="8" y1="419" x2="336" y2="419"/>
    </g>

    <!-- 1 -->
    <text x="16" y="254" fill="#7f8388">1</text>
    <text x="34" y="254" fill="#e7e8ea">Opening Titles</text>
    <text x="328" y="254" text-anchor="end" fill="#8b8f95" font-size="11">0:12</text>

    <!-- 2 — playing -->
    <rect x="8" y="263" width="328" height="26" fill="#4f8cff" fill-opacity="0.10"/>
    <rect x="9" y="266" width="2" height="20" fill="#4f8cff"/>
    <text x="16" y="280" fill="#7f8388">2</text>
    <text x="34" y="280" fill="#4f8cff" font-weight="700">Sponsor Reel — Acme Corp</text>
    <text x="328" y="280" text-anchor="end" fill="#8b8f95" font-size="11">1:30</text>

    <!-- 3 -->
    <text x="16" y="306" fill="#7f8388">3</text>
    <text x="34" y="306" fill="#e7e8ea">Halftime Bumper</text>
    <text x="328" y="306" text-anchor="end" fill="#8b8f95" font-size="11">0:08</text>

    <!-- 4 — selected -->
    <rect x="8" y="315" width="328" height="26" fill="#ffffff" fill-opacity="0.06"/>
    <text x="16" y="332" fill="#7f8388">4</text>
    <text x="34" y="332" fill="#e7e8ea">Interview — Coach Alvarez</text>
    <text x="328" y="332" text-anchor="end" fill="#8b8f95" font-size="11">4:15</text>

    <!-- 5 -->
    <text x="16" y="358" fill="#7f8388">5</text>
    <text x="34" y="358" fill="#e7e8ea">Crowd Cam (B-roll)</text>
    <text x="328" y="358" text-anchor="end" fill="#8b8f95" font-size="11">2:00</text>

    <!-- 6 — missing -->
    <text x="16" y="384" fill="#7f8388">6</text>
    <text x="34" y="384" fill="#e5a00d">Highlight Package<tspan font-size="10" fill="#e5a00d">   &#9888; file not found</tspan></text>

    <!-- 7 -->
    <text x="16" y="410" fill="#7f8388">7</text>
    <text x="34" y="410" fill="#e7e8ea">Sponsor Reel — Globex</text>
    <text x="328" y="410" text-anchor="end" fill="#8b8f95" font-size="11">1:30</text>

    <!-- 8 -->
    <text x="16" y="436" fill="#7f8388">8</text>
    <text x="34" y="436" fill="#e7e8ea">Closing Titles</text>
    <text x="328" y="436" text-anchor="end" fill="#8b8f95" font-size="11">0:20</text>
  </g>

  <!-- ===== Ops toolbar ===== -->
  <use href="#ic-plus"     transform="translate(13,456) scale(0.6667)"/>
  <use href="#ic-minus"    transform="translate(44,456) scale(0.6667)"/>
  <use href="#ic-chevup"   transform="translate(75,456) scale(0.6667)"/>
  <use href="#ic-chevdown" transform="translate(106,456) scale(0.6667)"/>
  <use href="#ic-pencil"   transform="translate(137,456) scale(0.6667)"/>
  <use href="#ic-trash"    transform="translate(168,456) scale(0.6667)"/>
  <use href="#ic-undo"     transform="translate(199,456) scale(0.6667)"/>
  <text x="330" y="468" font-size="11" text-anchor="end" fill="#9a9ea3">8 items · ~9:55</text>

  <!-- ===== On end + playlist files ===== -->
  <text x="9" y="501" font-size="11" fill="#9a9ea3">On end:</text>
  <rect x="58" y="483" width="215" height="28" rx="5" fill="#202327" stroke="#3a3e44"/>
  <text x="68" y="501" font-size="12" fill="#e7e8ea">Play next</text>
  <use href="#ic-chevdown" transform="translate(253,491) scale(0.5)"/>
  <use href="#ic-save"   transform="translate(283,489) scale(0.6667)"/>
  <use href="#ic-folder" transform="translate(315,489) scale(0.6667)"/>

  <!-- ===== Status lines ===== -->
  <text x="9" y="527" font-size="11" fill="#9a9ea3">Loaded: main-set.m3u8</text>
  <text x="9" y="546" font-size="11" fill="#6fcf8d">Playing: Sponsor Reel — Acme Corp</text>

  <!-- ===== Settings + version ===== -->
  <use href="#ic-settings" transform="translate(13,556) scale(0.6667)"/>
  <text x="330" y="574" font-size="11" text-anchor="end" fill="#4f8cff">v1.3.2</text>
</svg>
